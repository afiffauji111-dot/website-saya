<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPA MTs - Bank Materi & Soal</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;margin:0;padding:0}
body{background:#f0f4f8;color:#222;padding-bottom:70px}
.header{background:linear-gradient(135deg,#1e40af,#0891b2);color:#fff;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:18px}.header p{font-size:12px;opacity:.9;margin-top:4px}
.container{padding:12px;max-width:700px;margin:0 auto}
.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
h2{font-size:16px;color:#1e40af;margin-bottom:10px}
h3{font-size:14px;color:#334155;margin-bottom:6px}
input,textarea,select{width:100%;padding:10px;margin-bottom:8px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
textarea{min-height:80px;resize:vertical}
button{padding:10px 14px;border:none;border-radius:8px;font-size:14px;font-weight:bold;color:#fff;background:#2563eb;cursor:pointer;margin:2px;font-family:inherit}
button.full{width:100%}
button.hijau{background:#16a34a}button.merah{background:#dc2626}button.abu{background:#64748b}
button.ai{background:linear-gradient(135deg,#8b5cf6,#ec4899);font-size:13px}
button.aktif{background:#1e40af}
button:disabled{opacity:.6;cursor:not-allowed}
.item{background:#f8fafc;padding:10px;border-radius:8px;margin-bottom:8px;border-left:4px solid #2563eb}
.item.soal{border-left-color:#f59e0b}.item.nilai{border-left-color:#16a34a}.item.admin{border-left-color:#8b5cf6}
.item p{font-size:13px;margin-bottom:4px;white-space:pre-wrap;line-height:1.4}
.item .meta{font-size:11px;color:#64748b}
.kosong{text-align:center;color:#94a3b8;font-style:italic;padding:16px;font-size:13px}
.badge{display:inline-block;background:#dbeafe;color:#1e40af;font-size:11px;padding:2px 8px;border-radius:10px;margin-right:4px;margin-bottom:2px}
.hidden{display:none!important}
.nilai-besar{font-size:28px;font-weight:bold;color:#16a34a;text-align:center;padding:10px}
.login-box{max-width:400px;margin:40px auto;padding:20px}
.login-box h2{text-align:center;font-size:20px;margin-bottom:16px}
.login-box button{margin:6px 0;padding:14px}
.footer-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;box-shadow:0 -2px 8px rgba(0,0,0,.1);z-index:99}
.footer-nav button{flex:1;background:none;color:#64748b;border-radius:0;font-size:10px;padding:10px 2px;font-weight:normal}
.footer-nav button.aktif{color:#1e40af;font-weight:bold;background:#eff6ff}
.row{display:flex;gap:6px}.row>*{flex:1}
.info-box{background:#ede9fe;border-left:4px solid #8b5cf6;padding:10px;border-radius:6px;font-size:12px;color:#5b21b6;margin-bottom:8px;line-height:1.5}
.success-box{background:#dcfce7;border-left:4px solid #16a34a;padding:10px;border-radius:6px;font-size:12px;color:#166534;margin-bottom:8px}
.warn-box{background:#fef3c7;border-left:4px solid #f59e0b;padding:10px;border-radius:6px;font-size:12px;color:#92400e;margin-bottom:8px}
.floating-btn{position:fixed;bottom:70px;right:10px;z-index:100;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border:none;padding:12px 16px;border-radius:50px;font-size:13px;font-weight:bold;box-shadow:0 4px 12px rgba(139,92,246,0.4);cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="halamanLogin">
<div class="header"><h1>🔬 IPA MTs</h1><p>Bank Materi, Soal & Administrasi KBC + AI</p></div>
<div class="login-box"><div class="card"><h2>Pilih Peran Anda</h2>
<button class="full" onclick="login('guru')">👨‍🏫 Masuk sebagai Guru</button>
<button class="full hijau" onclick="login('murid')">👨‍🎓 Masuk sebagai Murid</button>
<p style="font-size:11px;color:#64748b;text-align:center;margin-top:10px">Data tersimpan otomatis di HP ini.</p>
</div></div></div>
<div id="halamanApp" class="hidden">
<div class="header"><h1 id="judulHalaman">🔬 IPA MTs</h1><p id="subJudul">Selamat datang</p></div>
<div class="container" id="konten"></div>
<div class="footer-nav" id="navBawah"></div>
<button class="floating-btn" id="btnApi" onclick="pindahTab('pengaturan')">⚙️ Atur API Key</button>
</div>
<script>
const LS={get:(k,d='[]')=>JSON.parse(localStorage.getItem('ipa_'+k)||d),set:(k,v)=>localStorage.setItem('ipa_'+k,JSON.stringify(v))};
let peran='',tabAktif='dashboard',soalAktif=null;
function login(p){peran=p;localStorage.setItem('ipa_peran',p);document.getElementById('halamanLogin').classList.add('hidden');document.getElementById('halamanApp').classList.remove('hidden');document.getElementById('subJudul').textContent=p==='guru'?'Mode Guru':'Mode Murid';tabAktif='dashboard';render();}
function logout(){if(!confirm('Keluar?'))return;localStorage.removeItem('ipa_peran');peran='';document.getElementById('halamanLogin').classList.remove('hidden');document.getElementById('halamanApp').classList.add('hidden');}
function pindahTab(t){tabAktif=t;soalAktif=null;render();window.scrollTo(0,0);}
function renderNav(){const nav=document.getElementById('navBawah');if(peran==='guru'){nav.innerHTML='<button class="'+(tabAktif==='dashboard'?'aktif':'')+'" onclick="pindahTab(\'dashboard\')">🏠<br>Beranda</button><button class="'+(tabAktif==='administrasi'?'aktif':'')+'" onclick="pindahTab(\'administrasi\')">📋<br>Admin</button><button class="'+(tabAktif==='materi'?'aktif':'')+'" onclick="pindahTab(\'materi\')">📚<br>Materi</button><button class="'+(tabAktif==='soal'?'aktif':'')+'" onclick="pindahTab(\'soal\')">❓<br>Soal</button><button class="'+(tabAktif==='nilai'?'aktif':'')+'" onclick="pindahTab(\'nilai\')">🏆<br>Nilai</button><button class="'+(tabAktif==='pengaturan'?'aktif':'')+'" onclick="pindahTab(\'pengaturan\')">⚙️<br>AI</button><button onclick="logout()">🚪<br>Keluar</button>';}else{nav.innerHTML='<button class="'+(tabAktif==='dashboard'?'aktif':'')+'" onclick="pindahTab(\'dashboard\')">🏠<br>Beranda</button><button class="'+(tabAktif==='materi'?'aktif':'')+'" onclick="pindahTab(\'materi\')">📚<br>Materi</button><button class="'+(tabAktif==='soal'?'aktif':'')+'" onclick="pindahTab(\'soal\')">✏️<br>Latihan</button><button class="'+(tabAktif==='nilai'?'aktif':'')+'" onclick="pindahTab(\'nilai\')">🏆<br>Nilaimu</button><button onclick="logout()">🚪<br>Keluar</button>';}}
function render(){renderNav();const el=document.getElementById('konten'),j=document.getElementById('judulHalaman');const v={dashboard:viewDashboard,administrasi:viewAdministrasi,materi:viewMateri,soal:peran==='guru'?viewSoalGuru:viewSoalMurid,nilai:viewNilai,pengaturan:viewPengaturan};const t={dashboard:'🏠 Beranda',administrasi:'📋 Administrasi KBC',materi:'📚 Materi',soal:peran==='guru'?'❓ Bank Soal':'✏️ Latihan',nilai:peran==='guru'?'🏆 Nilai Siswa':'🏆 Nilai Saya',pengaturan:'⚙️ Pengaturan AI'};j.textContent=t[tabAktif]||'🔬 IPA MTs';el.innerHTML=v[tabAktif]?v[tabAktif]():'';}
function viewDashboard(){const m=LS.get('materi'),s=LS.get('soal'),n=LS.get('nilai'),a=LS.get('admin');if(peran==='guru'){return'<div class="card"><h2>Selamat Datang, Guru! 👋</h2><p style="font-size:13px;color:#475569">Aplikasi Administrasi Kurikulum Merdeka (KBC) + AI.</p></div><div class="row"><div class="card" style="text-align:center"><div style="font-size:24px">📚</div><b>'+m.length+'</b><br><span style="font-size:12px">Materi</span></div><div class="card" style="text-align:center"><div style="font-size:24px">❓</div><b>'+s.length+'</b><br><span style="font-size:12px">Soal</span></div></div><div class="row"><div class="card" style="text-align:center"><div style="font-size:24px">🏆</div><b>'+n.length+'</b><br><span style="font-size:12px">Nilai</span></div><div class="card" style="text-align:center"><div style="font-size:24px">📋</div><b>'+a.length+'</b><br><span style="font-size:12px">Admin KBC</span></div></div><div class="card"><h3>⚡ Aksi Cepat</h3><button class="full ai" onclick="pindahTab(\'administrasi\')">📋 Buat Administrasi KBC</button><button class="full ai" onclick="pindahTab(\'materi\')">✨ Buat Materi dengan AI</button><button class="full ai" onclick="pindahTab(\'soal\')">✨ Buat Soal dengan AI</button><button class="full abu" onclick="pindahTab(\'nilai\')">Lihat Nilai Siswa</button></div>';}const nn=n.filter(x=>x.nama==='Murid');return'<div class="card"><h2>Selamat Belajar! 🎓</h2><p style="font-size:13px;color:#475569">Pilih menu Materi untuk belajar, atau Latihan untuk mengerjakan soal.</p></div><div class="card"><h3>📊 Statistikmu</h3><p style="font-size:13px">Total latihan: <b>'+nn.length+'</b></p><p style="font-size:13px">Nilai terbaik: <b>'+(nn.length?Math.max(...nn.map(x=>x.skor)):'-')+'</b></p><p style="font-size:13px">Nilai terakhir: <b>'+(nn.length?nn[nn.length-1].skor:'-')+'</b></p></div>';}
async function jalankanAI(btn,label,fn){btn.disabled=true;const t=btn.textContent;btn.textContent=label;try{await fn();}catch(e){alert('❌ '+e.message);}btn.disabled=false;btn.textContent=t;}
async function panggilGemini(prompt){const k=LS.get('apiKey','""');if(!k||k.length<10){alert('⚠️ Atur API Key dulu di menu ⚙️ AI!');throw new Error('API Key belum diatur');}const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+k,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});const d=await r.json();if(!d.candidates)throw new Error(d.error?.message||'Gagal');return d.candidates[0].content.parts[0].text;}
function viewPengaturan(){const key=LS.get('apiKey','""');const ada=key&&key.length>10;return'<div class="card"><h2>⚙️ Pengaturan AI</h2><p style="font-size:13px;color:#475569;margin-bottom:8px">Masukkan API Key Gemini (gratis dari Google) untuk mengaktifkan semua fitur AI.</p>'+(ada?'<div class="success-box">✅ API Key sudah terpasang.</div>':'<div class="warn-box">⚠️ API Key belum diatur.</div>')+'<div class="info-box"><b>📌 Cara dapat API Key:</b><br>1. Buka <b>aistudio.google.com/apikey</b><br>2. Login dengan Google<br>3. Klik "Create API key"<br>4. Copy kode, paste di bawah</div><input id="apiKeyInput" type="password" placeholder="Tempel API Key..." value="'+(ada?key:'')+'"><button class="full hijau" onclick="simpanApiKey()">💾 Simpan API Key</button><button class="full abu" onclick="tesApi()">🧪 Tes API Key</button></div>';}
function simpanApiKey(){const k=document.getElementById('apiKeyInput').value.trim();if(!k)return alert('API Key kosong!');LS.set('apiKey',k);alert('✅ Tersimpan!');render();}
async function tesApi(){const k=LS.get('apiKey','""');if(!k||k.length<10)return alert('Atur API Key dulu!');alert('⏳ Menguji...');try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+k,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Balas: OK'}]}]})});const d=await r.json();if(d.candidates)alert('✅ API Key berfungsi!');else alert('❌ Error: '+(d.error?.message||'Gagal'));}catch(e){alert('❌ '+e.message);}}
async function generateMateri(btn){const kelas=document.getElementById('matKelas').value;const topik=document.getElementById('matTopikAI').value.trim();if(!topik)return alert('Isi topik dulu!');await jalankanAI(btn,'⏳ AI menulis materi...',async()=>{const p='Buatkan materi pelajaran IPA untuk siswa '+kelas+' MTs dengan topik "'+topik+'". Tulis materi lengkap (350-500 kata), bahasa Indonesia formal tapi ramah anak MTs, dengan poin-poin penting dan contoh nyata sehari-hari.';const h=await panggilGemini(p);document.getElementById('matJudul').value=topik;document.getElementById('matIsi').value=h;alert('✅ Materi siap!');});}
async function generateSoal(btn){const kelas=document.getElementById('soKelas').value;const topik=document.getElementById('soTopik').value.trim();const jml=parseInt(document.getElementById('soJumlahAI').value)||5;if(!topik)return alert('Isi topik dulu!');await jalankanAI(btn,'⏳ AI membuat '+jml+' soal...',async()=>{const p='Buat '+jml+' soal pilihan ganda IPA untuk siswa '+kelas+' MTs dengan topik "'+topik+'". Format SETIAP soal sebagai JSON dengan kunci: pertanyaan, a, b, c, d, jawaban (A/B/C/D), pembahasan. Balas HANYA array JSON valid tanpa teks lain.';let h=await panggilGemini(p);h=h.replace(/json|/g,'').trim();const arr=JSON.parse(h);const data=LS.get('soal');arr.forEach(s=>data.push({kelas,topik,pertanyaan:s.pertanyaan,a:s.a,b:s.b,c:s.c,d:s.d,jawaban:s.jawaban,pembahasan:s.pembahasan,tgl:new Date().toLocaleDateString('id-ID')}));LS.set('soal',data);render();alert('✅ '+arr.length+' soal tersimpan!');});}
async function generateSoalUAS(btn){const kelas=document.getElementById('soKelas').value;const jml=parseInt(document.getElementById('soJumlahAI').value)||10;await jalankanAI(btn,'⏳ AI membuat '+jml+' soal UAS...',async()=>{const p='Buat '+jml+' soal pilihan ganda IPA untuk Ujian Akhir Semester '+kelas+' MTs. Format SETIAP soal sebagai JSON dengan kunci: pertanyaan, a, b, c, d, jawaban (A/B/C/D), pembahasan. Balas HANYA array JSON valid tanpa teks lain.';let h=await panggilGemini(p);h=h.replace(/json|/g,'').trim();const arr=JSON.parse(h);const data=LS.get('soal');arr.forEach(s=>data.push({kelas,topik:'UAS',pertanyaan:s.pertanyaan,a:s.a,b:s.b,c:s.c,d:s.d,jawaban:s.jawaban,pembahasan:s.pembahasan,tgl:new Date().toLocaleDateString('id-ID')}));LS.set('soal',data);render();alert('✅ '+arr.length+' soal UAS tersimpan!');});}
async function generateAdministrasi(btn,tipe){const kelas=document.getElementById('admKelas').value;const map={PROTA:'⏳ AI membuat PROTA...',PROMES:'⏳ AI membuat PROMES...',CP:'⏳ AI membuat CP...',ATP:'⏳ AI membuat ATP...',KKTP:'⏳ AI membuat KKTP...','MODUL AJAR':'⏳ AI membuat MODUL AJAR...',LKPD:'⏳ AI membuat LKPD...'};await jalankanAI(btn,map[tipe]||'⏳ AI menulis...',async()=>{let p='';if(tipe==='PROTA')p='Buat PROTA (Program Tahunan) mata pelajaran IPA untuk '+kelas+' MTs sesuai Kurikulum Merdeka. Isi: identitas mapel, daftar materi per semester (1 & 2), alokasi waktu (jam pelajaran), keterangan. Format tabel teks. Bahasa Indonesia formal.';else if(tipe==='PROMES')p='Buat PROMES (Program Semester) mata pelajaran IPA untuk '+kelas+' MTs sesuai Kurikulum Merdeka. Isi: rincian materi per bulan (Juli-Juni), alokasi jam, keterangan. Format tabel terstruktur.';else if(tipe==='CP')p='Buat CP (Capaian Pembelajaran) mata pelajaran IPA untuk '+kelas+' MTs sesuai Kurikulum Merdeka. Isi: Capaian Pembelajaran fase D, elemen (Pemahaman IPA & Keterampilan Proses), deskripsi capaian. Bahasa Indonesia formal.';else if(tipe==='ATP')p='Buat ATP (Alur Tujuan Pembelajaran) mata pelajaran IPA untuk '+kelas+' MTs sesuai Kurikulum Merdeka. Isi: nomor, CP, Tujuan Pembelajaran, Materi Pokok, alokasi waktu. Format tabel.';else if(tipe==='KKTP')p='Buat KKTP (Kriteria Ketercapaian Tujuan Pembelajaran) mata pelajaran IPA untuk '+kelas+' MTs sesuai Kurikulum Merdeka. Isi: Tujuan Pembelajaran, Kriteria Ketercapaian, Interval Nilai (0-40,41-65,66-85,86-100), Deskripsi. Format tabel.';else if(tipe==='MODUL AJAR')p='Buat MODUL AJAR mata pelajaran IPA untuk '+kelas+' MTs sesuai Kurikulum Merdeka. Isi lengkap: A. Informasi Umum (Identitas, Kompetensi Awal, Profil Pelajar Pancasila, Sarana Prasarana, Target Peserta Didik, Model Pembelajaran), B. Komponen Inti (Tujuan Pembelajaran, Pemahaman Bermakna, Pertanyaan Pemantik, Kegiatan Pembelajaran Pendahuluan-Inti-Penutup, Asesmen, Pengayaan & Remedial, Refleksi), C. Lampiran (LKPD, Bahan Bacaan, Glosarium, Daftar Pustaka).';else if(tipe==='LKPD')p='Buat LKPD (Lembar Kerja Peserta Didik) mata pelajaran IPA untuk '+kelas+' MTs sesuai Kurikulum Merdeka. Isi lengkap: A. Identitas (Mata Pelajaran, Kelas, Topik, Alokasi Waktu), B. Tujuan Pembelajaran, C. Alat dan Bahan, D. Langkah Kerja, E. Tabel Data Pengamatan, F. Pertanyaan Diskusi (minimal 5 soal), G. Kesimpulan, H. Refleksi. Bahasa Indonesia formal, cocok untuk siswa MTs.';const h=await panggilGemini(p);document.getElementById('admJudul').value=tipe+' '+kelas+' IPA';document.getElementById('admIsi').value=h;document.getElementById('admKategori').value=tipe;alert('✅ '+tipe+' siap!');});}
function viewAdministrasi(){const data=LS.get('admin');let h='<div class="card"><h2>📋 Administrasi KBC</h2><p style="font-size:12px;color:#64748b">PROTA, PROMES, CP, ATP, KKTP, MODUL AJAR, LKPD</p></div><div class="card"><h3>✨ Buat Administrasi dengan AI</h3><div class="info-box">Pilih kelas lalu ketuk tombol AI.</div><select id="admKelas"><option>Kelas 7</option><option>Kelas 8</option><option>Kelas 9</option></select><div class="row"><button class="ai" onclick="generateAdministrasi(this,\'PROTA\')">✨ PROTA</button><button class="ai" onclick="generateAdministrasi(this,\'PROMES\')">✨ PROMES</button></div><div class="row"><button class="ai" onclick="generateAdministrasi(this,\'CP\')">✨ CP</button><button class="ai" onclick="generateAdministrasi(this,\'ATP\')">✨ ATP</button></div><div class="row"><button class="ai" onclick="generateAdministrasi(this,\'KKTP\')">✨ KKTP</button><button class="ai" onclick="generateAdministrasi(this,\'MODUL AJAR\')">✨ MODUL AJAR</button></div><div class="row"><button class="ai" onclick="generateAdministrasi(this,\'LKPD\')">✨ LKPD</button></div></div><div class="card"><h3>✏️ Atau Tulis/Edit Manual</h3><input id="admJudul" placeholder="Judul"><select id="admKategori"><option>PROTA</option><option>PROMES</option><option>CP</option><option>ATP</option><option>KKTP</option><option>MODUL AJAR</option><option>LKPD</option><option>Lainnya</option></select><textarea id="admIsi" placeholder="Isi..." style="min-height:150px"></textarea><button class="full hijau" onclick="simpanAdmin()">💾 Simpan</button></div>';if(!data.length)return h+'<div class="card kosong">Belum ada data.</div>';h+='<div class="card"><h3>📁 Daftar ('+data.length+')</h3>';data.forEach((d,i)=>{h+='<div class="item admin"><span class="badge">'+d.kategori+'</span><span class="badge">'+d.kelas+'</span><h3 style="margin-top:6px">'+d.judul+'</h3><p>'+d.isi+'</p><div class="meta">📅 '+d.tgl+'</div><button class="merah" style="font-size:11px;padding:5px 8px;margin-top:6px" onclick="hapusItem(\'admin\','+i+')">Hapus</button></div>';});return h+'</div>';}
function simpanAdmin(){const j=document.getElementById('admJudul').value.trim();if(!j)return alert('Judul wajib!');const d=LS.get('admin');d.push({judul:j,isi:document.getElementById('admIsi').value.trim(),kategori:document.getElementById('admKategori').value,kelas:document.getElementById('admKelas').value,tgl:new Date().toLocaleDateString('id-ID')});LS.set('admin',d);render();alert('✅ Tersimpan!');}
function viewMateri(){const data=LS.get('materi');let h='<div class="card"><h2>📚 Materi Bahan Ajar</h2></div>';if(peran==='guru'){h+='<div class="card"><h3>✨ Buat Materi dengan AI</h3><div class="info-box">Pilih kelas & ketik topik.</div><select id="matKelas"><option>Kelas 7</option><option>Kelas 8</option><option>Kelas 9</option></select><input id="matTopikAI" placeholder="Topik"><button class="full ai" onclick="generateMateri(this)">✨ Generate Materi dengan AI</button></div><div class="card"><h3>✏️ Atau Tulis Manual</h3><input id="matJudul" placeholder="Judul materi"><textarea id="matIsi" placeholder="Isi materi..." style="min-height:150px"></textarea><button class="full hijau" onclick="simpanMateri()">💾 Simpan</button></div>';}if(!data.length)return h+'<div class="card kosong">Belum ada materi.</div>';['Kelas 7','Kelas 8','Kelas 9'].forEach(k=>{const l=data.map((m,i)=>({...m,idx:i})).filter(m=>m.kelas===k);if(!l.length)return;h+='<div class="card"><h3>📘 '+k+' ('+l.length+')</h3>';l.forEach(m=>{h+='<div class="item"><h3>'+m.judul+'</h3><p>'+m.isi+'</p><div class="meta">📅 '+m.tgl+'</div>'+(peran==='guru'?'<button class="merah" style="font-size:11px;padding:5px 8px;margin-top:6px" onclick="hapusItem(\'materi\','+m.idx+')">Hapus</button>':'')+'</div>';});h+='</div>';});return h;}
function simpanMateri(){const j=document.getElementById('matJudul').value.trim(),i=document.getElementById('matIsi').value.trim();if(!j||!i)return alert('Lengkapi!');const d=LS.get('materi');d.push({judul:j,isi:i,kelas:document.getElementById('matKelas').value,tgl:new Date().toLocaleDateString('id-ID')});LS.set('materi',d);render();alert('✅ Tersimpan!');}
function viewSoalGuru(){const data=LS.get('soal');let h='<div class="card"><h2>❓ Bank Soal IPA</h2></div><div class="card"><h3>✨ Buat Soal dengan AI</h3><div class="info-box">AI membuat soal + kunci + pembahasan.</div><select id="soKelas"><option>Kelas 7</option><option>Kelas 8</option><option>Kelas 9</option></select><input id="soTopik" placeholder="Topik/Bab"><select id="soJumlahAI"><option value="5">5 soal</option><option value="10">10 soal</option><option value="15">15 soal</option><option value="20">20 soal</option></select><button class="full ai" onclick="generateSoal(this)">✨ Generate Soal per Bab</button><button class="full ai" onclick="generateSoalUAS(this)">📝 Generate Soal UAS</button></div><div class="card"><h3>✏️ Atau Tulis Manual</h3><textarea id="soPertanyaan" placeholder="Pertanyaan..."></textarea><input id="soA" placeholder="Opsi A"><input id="soB" placeholder="Opsi B"><input id="soC" placeholder="Opsi C"><input id="soD" placeholder="Opsi D"><select id="soJawaban"><option value="A">Jawaban: A</option><option value="B">Jawaban: B</option><option value="C">Jawaban: C</option><option value="D">Jawaban: D</option></select><textarea id="soPembahasan" placeholder="Pembahasan..."></textarea><button class="full hijau" onclick="simpanSoal()">💾 Simpan</button></div>';if(!data.length)return h+'<div class="card kosong">Belum ada soal.</div>';['Kelas 7','Kelas 8','Kelas 9'].forEach(k=>{const l=data.map((s,i)=>({...s,idx:i})).filter(s=>s.kelas===k);if(!l.length)return;h+='<div class="card"><h3>📝 '+k+' ('+l.length+')</h3>';l.forEach(s=>{h+='<div class="item soal">'+(s.topik?'<span class="badge">'+s.topik+'</span>':'')+'<p><b>'+s.pertanyaan+'</b></p><p>A. '+s.a+'<br>B. '+s.b+'<br>C. '+s.c+'<br>D. '+s.d+'</p><p style="color:#16a34a"><b>✅ '+s.jawaban+'</b></p><p style="color:#475569;font-size:12px"><b>💡 '+s.pembahasan+'</b></p><button class="merah" style="font-size:11px;padding:5px 8px;margin-top:6px" onclick="hapusItem(\'soal\','+s.idx+')">Hapus</button></div>';});h+='</div>';});return h;}
function simpanSoal(){const p=document.getElementById('soPertanyaan').value.trim(),a=document.getElementById('soA').value.trim(),b=document.getElementById('soB').value.trim(),c=document.getElementById('soC').value.trim(),d=document.getElementById('soD').value.trim();if(!p||!a||!b||!c||!d)return alert('Semua wajib!');const dt=LS.get('soal');dt.push({kelas:document.getElementById('soKelas').value,topik:document.getElementById('soTopik').value.trim(),pertanyaan:p,a,b,c,d,jawaban:document.getElementById('soJawaban').value,pembahasan:document.getElementById('soPembahasan').value.trim(),tgl:new Date().toLocaleDateString('id-ID')});LS.set('soal',dt);render();alert('✅ Tersimpan!');}
function viewSoalMurid(){if(soalAktif!==null)return viewLatihan();let h='<div class="card"><h2>✏️ Latihan Soal</h2><p style="font-size:13px;color:#64748b">Pilih kelas.</p></div>';const data=LS.get('soal');if(!data.length)return h+'<div class="card kosong">Belum ada soal.</div>';['Kelas 7','Kelas 8','Kelas 9'].forEach(k=>{const j=data.filter(s=>s.kelas===k).length;h+='<div class="card"><h3>📘 '+k+'</h3><p style="font-size:13px;color:#64748b">'+j+' soal</p><button class="full '+(j?'':'abu')+'" '+(j?'':'disabled')+' onclick="mulaiLatihan(\''+k+'\')">Mulai</button></div>';});return h;}
function mulaiLatihan(kelas){const s=LS.get('soal').filter(x=>x.kelas===kelas);if(!s.length)return alert('Kosong');soalAktif={kelas,soal:s,nomor:0,skor:0,riwayat:[]};render();}
function viewLatihan(){const s=soalAktif;if(s.nomor>=s.soal.length){const nilai=Math.round((s.skor/s.soal.length)*100);const d=LS.get('nilai');d.push({nama:'Murid',kelas:s.kelas,skor:nilai,total:s.soal.length,benar:s.skor,tgl:new Date().toLocaleString('id-ID')});LS.set('nilai',d);return'<div class="card"><h2>🎉 Selesai!</h2><div class="nilai-besar">'+nilai+'</div><p style="text-align:center;font-size:13px">Benar '+s.skor+' dari '+s.soal.length+'</p><button class="full hijau" onclick="soalAktif=null;render()">Kembali</button></div><div class="card"><h3>📋 Review</h3>'+s.riwayat.map((r,i)=>'<div class="item" style="border-left-color:'+(r.benar?'#16a34a':'#dc2626')+'"><p><b>'+(i+1)+'. '+r.pertanyaan+'</b></p><p>Jawabanmu: <b>'+r.pilih+'</b> '+(r.benar?'✅':'❌')+'</p>'+(r.benar?'':'<p>Benar: <b style="color:#16a34a">'+r.jawaban+'</b></p>')+'<p style="font-size:12px;color:#475569"><b>💡 '+(r.pembahasan||'-')+'</b></p></div>').join('')+'</div>';}const q=s.soal[s.nomor];return'<div class="card"><div style="font-size:12px;color:#64748b">'+s.kelas+' • Soal '+(s.nomor+1)+'/'+s.soal.length+'</div><h3 style="margin-top:8px">'+q.pertanyaan+'</h3></div><div class="card"><div style="background:#eff6ff;padding:10px;border-radius:8px;margin:6px 0;font-size:13px;cursor:pointer" onclick="jawab(\'A\')">A. '+q.a+'</div><div style="background:#eff6ff;padding:10px;border-radius:8px;margin:6px 0;font-size:13px;cursor:pointer" onclick="jawab(\'B\')">B. '+q.b+'</div><div style="background:#eff6ff;padding:10px;border-radius:8px;margin:6px 0;font-size:13px;cursor:pointer" onclick="jawab(\'C\')">C. '+q.c+'</div><div style="background:#eff6ff;padding:10px;border-radius:8px;margin:6px 0;font-size:13px;cursor:pointer" onclick="jawab(\'D\')">D. '+q.d+'</div></div><div class="card" style="text-align:center;font-size:13px;color:#64748b">Skor: <b style="color:#16a34a">'+s.skor+'</b></div>';}
function jawab(p){const s=soalAktif,q=s.soal[s.nomor];const b=p===q.jawaban;if(b)s.skor++;s.riwayat.push({pertanyaan:q.pertanyaan,pilih:p,jawaban:q.jawaban,benar:b,pembahasan:q.pembahasan});s.nomor++;render();}
function viewNilai(){const data=LS.get('nilai');if(peran==='murid'){const s=data.filter(n=>n.nama==='Murid');if(!s.length)return'<div class="card kosong">Belum ada nilai.</div>';let h='<div class="card"><h2>🏆 Nilai Saya</h2></div>';s.slice().reverse().forEach(n=>{h+='<div class="item nilai"><span class="badge">'+n.kelas+'</span><h3 style="margin-top:6px">Nilai: '+n.skor+'</h3><p>Benar '+n.benar+'/'+n.total+'</p><div class="meta">📅 '+n.tgl+'</div></div>';});return h;}if(!data.length)return'<div class="card kosong">Belum ada nilai.</div>';const rata=Math.round(data.reduce((a,b)=>a+b.skor,0)/data.length);let h='<div class="card"><h2>🏆 Nilai Siswa</h2></div><div class="card" style="text-align:center"><div style="font-size:12px;color:#64748b">Rata-rata</div><div class="nilai-besar">'+rata+'</div></div><div class="card"><h3>📋 Daftar</h3>';data.slice().reverse().forEach((n,i)=>{const idx=data.length-1-i;h+='<div class="item nilai"><span class="badge">'+n.kelas+'</span><h3 style="margin-top:6px">'+n.nama+' — '+n.skor+'</h3><p>Benar '+n.benar+'/'+n.total+'</p><div class="meta">📅 '+n.tgl+'</div><button class="merah" style="font-size:11px;padding:5px 8px;margin-top:6px" onclick="hapusItem(\'nilai\','+idx+')">Hapus</button></div>';});return h+'</div>';}
function hapusItem(k,i){if(!confirm('Hapus?'))return;const d=LS.get(k);d.splice(i,1);LS.set(k,d);render();}
window.onload=()=>{const p=localStorage.getItem('ipa_peran');if(p)login(p);};
</script>
</body>
